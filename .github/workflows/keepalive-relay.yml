# 友だちと遊ぶための中継サーバー（Render の無料 Web Service「hidamari-relay」）を眠らせないための、定期的な呼びかけ。
# Render の無料プランは、15分だれもつながないと眠る。GitHub が 10分ごとにアクセスして起こしておく。
# GitHub のサーバーで動くので、チャットやパソコンの電源に関係なく動きつづける。
# （GitHub の定期実行は混んでいると数分おくれることがあるので、15分より短い 10分ごとにしてある）
name: keepalive-relay
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping relay
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://hidamari-relay.onrender.com/ || echo 000)
            echo "try $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
